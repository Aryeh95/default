# PD fan controller, rev B (Seeed XIAO ESP32-C6): Zigbee version.
# Joins ZHA or Zigbee2MQTT as a Zigbee router (it's mains powered, so it also extends
# the mesh). There's no Wi-Fi in this build, so firmware updates go over the XIAO's
# USB port.
#
# ESPHome's Zigbee support exposes switches, numbers, sensors and binary sensors only.
# The fan therefore appears as "Fan Power" (on/off) plus "Fan Speed" (0-100 %).
# Text sensors and buttons aren't exposed, so "Charger Protocol" is missing and
# "Reset Filter Hours" is a switch that turns itself back off. Depending on your
# Zigbee2MQTT version the device may show as generic endpoints at first.
#
# Pairing: flash, put Home Assistant's Zigbee integration in "add device" mode,
# then power the board.

substitutions:
  name: pd-fan-ctrl
  friendly_name: PD Fan Controller

packages:
  core: !include common/pd-fan-ctrl-core.yaml

zigbee:
  router: true

switch:
  - platform: template
    name: "Fan Power"
    icon: "mdi:fan"
    lambda: 'return id(purifier).state;'
    turn_on_action:
      - fan.turn_on: purifier
    turn_off_action:
      - fan.turn_off: purifier

  - platform: template
    id: reset_filter_switch
    name: "Reset Filter Hours"
    icon: "mdi:restore"
    lambda: 'return false;'
    turn_on_action:
      - lambda: 'id(filter_minutes) = 0.0f;'
      - switch.template.publish:
          id: reset_filter_switch
          state: false

number:
  - platform: template
    name: "Fan Speed"
    icon: "mdi:speedometer"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    lambda: 'return id(purifier).speed;'
    set_action:
      - lambda: |-
          // 0 % turns the fan off; anything else turns it on at that speed
          if (x < 1) {
            id(purifier).turn_off().perform();
          } else {
            id(purifier).turn_on().set_speed((int) x).perform();
          }
