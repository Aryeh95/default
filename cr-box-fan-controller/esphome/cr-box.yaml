# ESPHome config for the CR Box fan controller (Seeed XIAO ESP32-C6)
#
# Pin map (XIAO pin -> GPIO -> board net)
#   D0  GPIO0   VSENSE    USB-C input voltage (100k / 15k divider)
#   D1  GPIO1   FAN_EN    high = 12 V fan rail on
#   D2  GPIO2   PWM_MCU   25 kHz fan PWM, inverted (open-collector driver)
#   D3  GPIO21  PD_PG     low = USB PD negotiation succeeded
#   D4  GPIO22  SDA       I2C header
#   D5  GPIO23  SCL       I2C header
#   D6  GPIO16  TX        UART header
#   D7  GPIO17  RX        UART header
#   D8  GPIO19  TACH_MCU  FAN1 tach, 2 pulses per revolution

esphome:
  name: cr-box
  friendly_name: CR Box

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO2
    frequency: 25000 Hz
    inverted: true          # Q3 pulls the fan PWM line low when the pin is high

switch:
  - platform: gpio
    id: fan_power
    pin: GPIO1
    restore_mode: ALWAYS_OFF
    internal: true

fan:
  - platform: speed
    name: "Purifier Fan"
    output: fan_pwm
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - switch.turn_on: fan_power
    on_turn_off:
      - switch.turn_off: fan_power

sensor:
  - platform: pulse_counter
    name: "Fan RPM"
    pin: GPIO19
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: 10s
    filters:
      - multiply: 0.5       # 2 pulses per revolution

  - platform: adc
    name: "Input Voltage"
    id: vbus
    pin: GPIO0
    attenuation: 12db
    update_interval: 10s
    accuracy_decimals: 1
    filters:
      - multiply: 7.667     # (100k + 15k) / 15k

binary_sensor:
  - platform: gpio
    name: "USB PD Negotiated"
    pin:
      number: GPIO21
      inverted: true
    entity_category: diagnostic

  - platform: template
    name: "Charger OK"
    device_class: power
    entity_category: diagnostic
    lambda: 'return id(vbus).state > 13.5;'   # below this the fans will not reach full speed

# Optional sensors on the headers, for example:
# i2c:
#   sda: GPIO22
#   scl: GPIO23
# uart:
#   tx_pin: GPIO16
#   rx_pin: GPIO17
#   baud_rate: 9600
