# Seeed XIAO ESP32-C6: chip settings and the GPIO behind each XIAO pin used by the board.
# Onboard ceramic antenna (U.FL optional). Wi-Fi, Thread or Zigbee.

substitutions:
  pin_d0: GPIO0
  pin_d1: GPIO1
  pin_d2: GPIO2
  pin_d3: GPIO21
  pin_d4: GPIO22
  pin_d5: GPIO23
  pin_d6: GPIO16
  pin_d7: GPIO17
  pin_d8: GPIO19
  pin_d9: GPIO20

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
