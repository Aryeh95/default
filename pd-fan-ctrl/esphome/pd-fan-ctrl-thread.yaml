# PD fan controller, rev B (Seeed XIAO ESP32-C6): Thread version.
# Same entities as the Wi-Fi version, reached over a Thread network instead.
#
# Needs a Thread border router on your network (Home Assistant Connect ZBT-1/ZBT-2,
# HomePod mini, Nest Hub and so on) and the network's credentials in secrets.yaml as
# thread_tlv: in Home Assistant go to Settings > Devices & services > Thread >
# Configure, open the network's info (i) and copy its "Active dataset TLVs".
# ESPHome can't run Wi-Fi and Thread together, so this build has no Wi-Fi.
# Updates still work over the air through the border router.

substitutions:
  name: pd-fan-ctrl
  friendly_name: PD Fan Controller

packages:
  core: !include common/pd-fan-ctrl-core.yaml

api:
ota:
  - platform: esphome

network:
  enable_ipv6: true         # Thread is IPv6-only

openthread:
  tlv: !secret thread_tlv
  device_type: FTD          # mains powered, so it can also route for other Thread devices
