# CR Box fan controller, rev B (Seeed XIAO ESP32-C6): Wi-Fi version.
# Fan control and sensors live in common/cr-box-revB-core.yaml; this file adds Wi-Fi
# and the Home Assistant API. Needs wifi_ssid and wifi_password in secrets.yaml.

substitutions:
  name: cr-box
  friendly_name: CR Box

packages:
  core: !include common/cr-box-revB-core.yaml

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}                    # fallback hotspot if the Wi-Fi network can't be reached

captive_portal:
