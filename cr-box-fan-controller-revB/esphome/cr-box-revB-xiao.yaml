# ESPHome config for the CR Box fan controller, rev B with a Seeed XIAO ESP32-C6
#
# Pin map (XIAO pin -> GPIO -> board net)
#   D0  GPIO0   VSENSE    USB-C input voltage (100k / 15k divider)
#   D1  GPIO1   FAN_EN    high = 12 V fan rail on
#   D2  GPIO2   PWM_MCU   25 kHz fan PWM, inverted (open-collector driver)
#   D3  GPIO21  PD_PG     low = USB PD negotiation succeeded (open drain, internal pull-up)
#   D4  GPIO22  SDA       I2C header
#   D5  GPIO23  SCL       I2C header
#   D6  GPIO16  TX        UART header
#   D7  GPIO17  RX        UART header
#   D8  GPIO19  TACH_MCU  FAN1 tach, 2 pulses per revolution
#   D9  GPIO20  TACH2_MCU FAN2 tach, 2 pulses per revolution

esphome:
  name: cr-box
  friendly_name: CR Box

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

# Filter Hours is saved to flash; writing it every 30 min instead of every minute
# spares the flash. A power cut loses at most 30 min of the count.
preferences:
  flash_write_interval: 30min

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO2
    frequency: 25000 Hz
    inverted: true          # Q3 pulls the fan PWM line low when the pin is high

switch:
  - platform: gpio
    id: fan_power           # 12 V fan rail (TPS54302 enable)
    pin: GPIO1
    restore_mode: ALWAYS_OFF
    internal: true

  # Turn on if a fan is plugged into FAN2. Leave off when all fans are daisy-chained
  # from FAN1, otherwise "Fan 2 Problem" would always report a stopped fan.
  - platform: template
    id: fan2_fitted
    name: "Fan 2 Fitted"
    icon: "mdi:fan-plus"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

globals:
  - id: duty                # PWM level currently applied to the fans, 0..1
    type: float
    initial_value: '0'
  - id: filter_minutes      # minutes the fans have run on the current filter
    type: float
    restore_value: true
    initial_value: '0'

fan:
  - platform: template
    id: purifier
    name: "Purifier Fan"
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - script.execute: apply_fan

script:
  # Applies the fan entity's state to the hardware.
  # - The 12 V rail is only switched on while the charger supplies 15 V
  #   ("Charger OK"); on a 5 V-only supply the fans stay off.
  # - On start-up the fans begin at 20 % and ramp to the set speed in 5 % steps
  #   every 100 ms, so 4-5 fans don't all draw full start-up current at once.
  - id: apply_fan
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(purifier).state && id(charger_ok).state;'
          then:
            - if:
                condition:
                  switch.is_off: fan_power
                then:
                  - lambda: |-
                      id(duty) = 0.2f;
                      id(fan_pwm).set_level(id(duty));
                  - switch.turn_on: fan_power
                  - delay: 500ms
            - while:
                condition:
                  lambda: 'return fabsf(id(duty) - id(purifier).speed / 100.0f) > 0.001f;'
                then:
                  - lambda: |-
                      const float target = id(purifier).speed / 100.0f;
                      const float step = 0.05f;
                      if (id(duty) < target) id(duty) = std::min(target, id(duty) + step);
                      else id(duty) = std::max(target, id(duty) - step);
                      id(fan_pwm).set_level(id(duty));
                  - delay: 100ms
          else:
            - switch.turn_off: fan_power
            - lambda: |-
                id(duty) = 0.0f;
                id(fan_pwm).set_level(0.0f);

sensor:
  - platform: pulse_counter
    id: fan1_rpm
    name: "Fan 1 RPM"
    pin: GPIO19
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: 10s
    filters:
      - multiply: 0.5       # 2 pulses per revolution

  - platform: pulse_counter
    id: fan2_rpm
    name: "Fan 2 RPM"
    pin: GPIO20
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: 10s
    filters:
      - multiply: 0.5       # 2 pulses per revolution

  - platform: adc
    name: "Input Voltage"
    id: vbus
    pin: GPIO0
    attenuation: 12db
    update_interval: 2s
    accuracy_decimals: 1
    filters:
      - multiply: 7.667     # (100k + 15k) / 15k
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  - platform: template
    name: "Filter Hours"
    unit_of_measurement: "h"
    icon: "mdi:air-filter"
    accuracy_decimals: 1
    state_class: total_increasing   # long-term statistics in Home Assistant
    update_interval: 60s
    lambda: 'return id(filter_minutes) / 60.0f;'

binary_sensor:
  - platform: gpio
    name: "USB PD Negotiated"
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true        # rev B has no external pull-up on PD_PG
    entity_category: diagnostic

  # Gates the 12 V fan rail: true while the charger supplies 15 V.
  - platform: template
    id: charger_ok
    name: "Charger OK"
    device_class: power
    entity_category: diagnostic
    lambda: 'return id(vbus).has_state() && id(vbus).state > 13.5;'
    filters:
      - delayed_off: 2s     # ignore a brief dip when the fans start
    on_state:
      - script.execute: apply_fan

  # What the hardware is actually doing. "Purifier Fan" stays on as the user's request
  # (so the fans resume when the charger recovers); this shows whether the 12 V rail is on.
  - platform: template
    name: "Fans Running"
    device_class: running
    lambda: 'return id(fan_power).state;'

  # A fan that has stopped or come unplugged: rail on, asked for more than 30 %,
  # but its tach reads under 200 RPM for 30 s. FAN2 is only checked when
  # "Fan 2 Fitted" is on.
  - platform: template
    name: "Fan 1 Problem"
    device_class: problem
    lambda: |-
      return id(fan_power).state && id(duty) > 0.3f &&
             id(fan1_rpm).has_state() && id(fan1_rpm).state < 200;
    filters:
      - delayed_on: 30s

  - platform: template
    name: "Fan 2 Problem"
    device_class: problem
    lambda: |-
      return id(fan2_fitted).state && id(fan_power).state && id(duty) > 0.3f &&
             id(fan2_rpm).has_state() && id(fan2_rpm).state < 200;
    filters:
      - delayed_on: 30s

# Filter run time: counts a minute whenever the 12 V rail is on. The count is saved
# to flash, so it survives reboots.
interval:
  - interval: 60s
    then:
      - lambda: |-
          if (id(fan_power).state) id(filter_minutes) += 1.0f;

button:
  - platform: template
    name: "Reset Filter Hours"
    icon: "mdi:restore"
    entity_category: config
    on_press:
      - lambda: 'id(filter_minutes) = 0.0f;'

# Optional sensors on the headers. Both headers use 3.3 V logic. The UART header
# supplies 5 V power, which suits sensors like the PMS5003 or SEN55 (5 V power,
# 3.3 V logic). A sensor with 5 V logic needs a voltage divider on its TX line.
# For example:
# i2c:
#   sda: GPIO22
#   scl: GPIO23
# uart:
#   tx_pin: GPIO16
#   rx_pin: GPIO17
#   baud_rate: 9600
